services:
  tabby:
    image: ghcr.io/eugeny/tabby-web:latest
    container_name: tabby
    restart: always
    volumes:
      - ./data:/app-dist
    ports:
      - '127.0.0.1:9090:8000'
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app-dist/db.sqlite3
      - PORT=8000
      - DEBUG=true
      - SOCIAL_AUTH_GITHUB_KEY=${GITHUB_CLIENT_ID}
      - SOCIAL_AUTH_GITHUB_SECRET=${GITHUB_CLIENT_SECRET}
